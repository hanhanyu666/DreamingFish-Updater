<title id="whale-title">梦鱼更新器 · 云鲸</title>
<desc id="whale-desc">蓝色水面上，奶油白的小鲸鱼扬起尾鳍。浅蓝腹部、圆润侧鳍与粉色腮红丰富了表情，喷水泡形成一枚轻盈的更新符号。</desc>
