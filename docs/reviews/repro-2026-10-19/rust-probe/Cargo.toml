[package]
name = "dfs-review-proxy-probe"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "proxy-probe"
path = "main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "2"
uuid = { version = "=1.24.0", features = ["v4"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "cookies", "rustls-tls", "stream"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
hyper = { version = "=1.11.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "server", "http1"] }
http-body-util = "=0.1.4"
bytes = "=1.12.1"
futures-util = "=0.3.33"
