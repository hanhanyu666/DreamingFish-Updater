<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>玩家端 · 玩家作品画廊</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@700;900&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.dfs-hv{transition:background-color .18s ease,border-color .18s ease,color .18s ease}
.dfs-hv:hover{background-color:rgba(255,255,255,.12)!important;color:#fff!important}
.dfs-close:hover{background-color:#C4302B!important;color:#fff!important}
.dfs-nav:hover{color:#fff!important}
.dfs-tile .dfs-zoom{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.dfs-tile:hover .dfs-zoom{transform:scale(1.06)}
.dfs-tile .dfs-cap{transition:transform .35s ease}
.dfs-tile:hover .dfs-cap{transform:translateY(-3px)}
@keyframes dfs-in{0%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
.dfs-in{animation:dfs-in .35s cubic-bezier(.2,.7,.2,1) both}
:focus-visible{outline:2px solid #FFF6E0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 1180px; height: 680px; overflow: hidden; border-radius: 12px; background: #070A12; color: #F3EFE6; font-family: 'Noto Sans SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased">
  <img src="/_blob/8e4a628a4c3abcbe2cb023589ae04d86" alt="" aria-hidden="true" style="position: absolute; left: -60px; top: -60px; width: 1300px; height: 800px; object-fit: cover; filter: blur(50px) brightness(.3) saturate(1.3)">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(7,10,18,.52)"></div>
  <svg aria-hidden="true" width="1180" height="680" style="position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay">
    <filter id="dfs-grain-g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
    <rect width="100%" height="100%" filter="url(#dfs-grain-g)"></rect>
  </svg>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 28px; padding-left: 20px; z-index: 5">
    <a href="Main.dc.html" aria-label="鲸歌生存服 首页" style="display: flex; align-items: center; gap: 10px">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #0E2533; border: 1px solid {{accentSoft}}; display: grid; place-items: center; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 16px; color: {{accent}}; flex: none">鲸</span>
      <span style="display: flex; flex-direction: column; line-height: 1.15">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: .04em">鲸歌生存服</span>
        <span style="font-family: Silkscreen, ui-monospace, monospace; font-size: 8.5px; letter-spacing: .18em; color: rgba(243,239,230,.62)">WHALESONG</span>
      </span>
    </a>
    <nav aria-label="主导航" style="display: flex; align-items: stretch; gap: 2px; align-self: stretch">
      <a href="Main.dc.html" class="dfs-nav" style="display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 500; color: rgba(243,239,230,.74)">首页</a>
      <a href="News.dc.html" class="dfs-nav" style="display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 500; color: rgba(243,239,230,.74)">公告</a>
      <a href="Guide.dc.html" class="dfs-nav" style="display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 500; color: rgba(243,239,230,.74)">服务器介绍</a>
      <a href="Gallery.dc.html" aria-current="page" style="position: relative; display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 700; color: #FFFFFF">画廊<span style="position: absolute; left: 12px; right: 12px; bottom: 10px; height: 2px; border-radius: 2px; background: {{accent}}"></span></a>
    </nav>
    <div style="flex: 1; align-self: stretch"></div>
    <a href="Main.dc.html" class="dfs-hv" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid {{accentSoft}}; background: {{accentTint}}; font-size: 12px; color: #F3EFE6">
      <span style="width: 18px; height: 18px; border-radius: 50%; background: {{accent}}; color: #04161A; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      r13 已就绪 · 窗口保持打开
    </a>
    <div style="display: flex; align-self: stretch">
      <button type="button" class="dfs-hv" aria-label="最小化" style="width: 46px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: rgba(243,239,230,.8)"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.2"><path d="M1.5 6h9"></path></svg></button>
      <button type="button" class="dfs-hv" aria-label="最大化" style="width: 46px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: rgba(243,239,230,.8)"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.2"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"></rect></svg></button>
      <button type="button" class="dfs-close" aria-label="关闭" style="width: 46px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: rgba(243,239,230,.8); border-top-right-radius: 12px"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.2"><path d="M2 2l8 8"></path><path d="M10 2l-8 8"></path></svg></button>
    </div>
  </header>

  <main style="position: absolute; left: 40px; right: 40px; top: 52px; bottom: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-top: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Silkscreen, ui-monospace, monospace; font-size: 10px; letter-spacing: .2em; color: {{accent}}">PLAYER GALLERY</span>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 30px; line-height: 1.2; color: #FFF6E0">玩家作品</h1>
          <span style="font-size: 13px; color: rgba(243,239,230,.68)">每周由建筑组挑选，点开看大图和坐标</span>
        </div>
      </div>
      <div role="group" aria-label="按分类筛选" style="display: flex; gap: 6px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: background-color .18s ease">{{f.label}}<span style="font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums">{{f.count}}</span></button>
        </sc-for>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{shots}}" as="g" hint-placeholder-count="7">
        <button type="button" class="dfs-tile" onClick="{{g.open}}" aria-label="查看大图：{{g.title}}，作者 {{g.author}}" style="{{g.area}}; position: relative; overflow: hidden; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); padding: 0; cursor: pointer; background: #0B0F18; text-align: left; opacity: {{g.opacity}}; filter: {{g.dim}}; transition: opacity .35s ease, filter .35s ease">
          <span class="dfs-zoom" style="position: absolute; inset: 0; display: block">
            <img src="/_blob/8e4a628a4c3abcbe2cb023589ae04d86" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{g.pos}}; transform-origin: {{g.pos}}; scale: {{g.scale}}; filter: {{g.filter}}">
            <span style="position: absolute; inset: 0; background: {{g.tint}}; mix-blend-mode: {{g.blend}}"></span>
          </span>
          <span style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(6,9,16,.86) 0%, rgba(6,9,16,0) 46%)"></span>
          <sc-if value="{{g.featured}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; left: 14px; top: 14px; height: 24px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1A1204; background: #FFD27A">本周精选</span>
          </sc-if>
          <span class="dfs-cap" style="position: absolute; left: 16px; right: 16px; bottom: 13px; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: {{g.titleSize}}px; font-weight: 700; color: #FFF6E0; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.title}}</span>
            <span style="font-size: 11.5px; color: rgba(243,239,230,.74)">by {{g.author}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </main>

  <sc-if value="{{lightbox}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-modal="true" aria-label="{{current.title}}" style="position: absolute; left: 0; right: 0; top: 52px; bottom: 0; z-index: 20; background: rgba(4,6,12,.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
      <div class="dfs-in" style="position: relative; width: 860px; height: 440px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6)">
        <img src="/_blob/8e4a628a4c3abcbe2cb023589ae04d86" alt="{{current.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{current.pos}}; transform-origin: {{current.pos}}; scale: {{current.lbScale}}; filter: {{current.filter}}">
        <div style="position: absolute; inset: 0; background: {{current.tint}}; mix-blend-mode: {{current.blend}}"></div>
      </div>
      <div style="width: 860px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: baseline; gap: 12px">
            <h2 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 22px; color: #FFF6E0">{{current.title}}</h2>
            <span style="font-size: 12.5px; color: rgba(243,239,230,.7)">by {{current.author}} · {{current.cat}}</span>
          </div>
          <p style="margin: 0; font-size: 13.5px; line-height: 1.7; color: rgba(243,239,230,.8)">{{current.desc}}</p>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="height: 32px; padding: 0 12px; border-radius: 9px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12.5px; color: rgba(243,239,230,.86)"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: {{accent}}; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>{{current.coords}}</span>
          <span style="font-family: Silkscreen, ui-monospace, monospace; font-size: 11px; letter-spacing: .1em; color: rgba(243,239,230,.66)">{{counter}}</span>
        </div>
      </div>
      <button type="button" class="dfs-hv" onClick="{{prev}}" aria-label="上一张" style="position: absolute; left: 36px; top: 50%; margin-top: -60px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); display: grid; place-items: center; cursor: pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M14.5 6l-6 6 6 6"></path></svg></button>
      <button type="button" class="dfs-hv" onClick="{{next}}" aria-label="下一张" style="position: absolute; right: 36px; top: 50%; margin-top: -60px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); display: grid; place-items: center; cursor: pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9.5 6l6 6-6 6"></path></svg></button>
      <button type="button" class="dfs-hv" onClick="{{close}}" aria-label="关闭大图" style="position: absolute; right: 24px; top: 20px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); display: grid; place-items: center; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2EE8DF","options":["#2EE8DF","#FFB454","#9BE15D","#B79CFF"],"section":"主题"},"$preview":{"width":1180,"height":680}}'>
var NONE = 'rgba(0,0,0,0)';
var SHOTS = [
  { title: '湖畔小镇全景', author: '鲸歌建筑组', cat: '建筑', desc: '第三赛季新主城的第一张全景，石桥连接着居住区和码头。', coords: 'X 0 · Z 0', pos: '50% 50%', scale: 1, filter: 'saturate(1.05)', tint: NONE, blend: 'normal', area: 'grid-column: 1 / span 2; grid-row: 1 / span 2', featured: true, big: true },
  { title: '石拱桥', author: 'Kirin_Ra', cat: '建筑', desc: '用石砖和圆石墙一块块垒出来的三孔拱桥，桥下能过船。', coords: 'X 212 · Z -86', pos: '62% 70%', scale: 2.3, filter: 'saturate(1.08)', tint: NONE, blend: 'normal', area: 'grid-column: 3; grid-row: 1' },
  { title: '山顶瞭望台', author: '阿柚', cat: '风景', desc: '从这里能看到整个新手村，傍晚的时候最好看。', coords: 'X -140 · Z -512', pos: '50% 34%', scale: 2.2, filter: 'saturate(1.05)', tint: NONE, blend: 'normal', area: 'grid-column: 4; grid-row: 1 / span 2' },
  { title: '秋收麦田', author: '小满', cat: '风景', desc: '麦田旁边的木栅栏，是全服玩家一起补完的。', coords: 'X 96 · Z 140', pos: '30% 64%', scale: 2.6, filter: 'saturate(1.1) sepia(.08)', tint: NONE, blend: 'normal', area: 'grid-column: 3; grid-row: 2' },
  { title: '日出时的湖面', author: '阿柚', cat: '风景', desc: '早上六点上线的人才看得到的颜色。', coords: 'X -320 · Z 64', pos: '8% 42%', scale: 1.7, filter: 'saturate(1.05)', tint: NONE, blend: 'normal', area: 'grid-column: 1 / span 2; grid-row: 3' },
  { title: '灯笼小径', author: 'MossyStone', cat: '建筑', desc: '夜里沿着灯笼一直走，就能回到出生点。', coords: 'X 248 · Z 188', pos: '86% 86%', scale: 2.2, filter: 'saturate(1.08)', tint: NONE, blend: 'normal', area: 'grid-column: 3; grid-row: 3' },
  { title: '夜里的小屋', author: 'Kirin_Ra', cat: '建筑', desc: '主城第一栋双层木屋，屋顶花了整整两个周末。', coords: 'X 305 · Z -12', pos: '80% 50%', scale: 2.2, filter: 'brightness(.55) saturate(.85) contrast(1.1)', tint: 'linear-gradient(180deg, rgba(24,44,120,.55), rgba(10,16,48,.45))', blend: 'multiply', area: 'grid-column: 4; grid-row: 3' }
];
var FILTERS = ['全部', '建筑', '风景'];

class Component extends DCLogic {
  componentDidMount() {
    this.setState({ filter: '全部', open: -1 });
  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var accent = this.props.accent || '#2EE8DF';
    var filter = s.filter || '全部';
    var open = typeof s.open === 'number' ? s.open : -1;
    var shots = SHOTS.map(function (g, i) {
      var match = filter === '全部' || g.cat === filter;
      return Object.assign({}, g, {
        featured: !!g.featured,
        titleSize: g.big ? 17 : 13.5,
        opacity: match ? 1 : 0.28,
        dim: match ? 'none' : 'grayscale(.7)',
        open: function () { self.setState({ open: i }); }
      });
    });
    var filters = FILTERS.map(function (f) {
      var on = f === filter;
      var count = f === '全部' ? SHOTS.length : SHOTS.filter(function (g) { return g.cat === f; }).length;
      return {
        label: f, count: count, pressed: on ? 'true' : 'false',
        bg: on ? 'color-mix(in oklab, ' + accent + ' 18%, transparent)' : 'rgba(255,255,255,.05)',
        border: on ? 'color-mix(in oklab, ' + accent + ' 55%, transparent)' : 'rgba(255,255,255,.1)',
        color: on ? '#FFFFFF' : 'rgba(243,239,230,.78)',
        pick: function () { self.setState({ filter: f }); }
      };
    });
    var idx = open < 0 ? 0 : open;
    var cur = SHOTS[idx];
    var n = SHOTS.length;
    return {
      accent: accent,
      accentSoft: 'color-mix(in oklab, ' + accent + ' 45%, transparent)',
      accentTint: 'color-mix(in oklab, ' + accent + ' 15%, transparent)',
      shots: shots,
      filters: filters,
      lightbox: open >= 0,
      current: Object.assign({}, cur, { lbScale: Math.max(1, cur.scale * 0.72) }),
      counter: (idx < 9 ? '0' : '') + (idx + 1) + ' / ' + (n < 10 ? '0' : '') + n,
      prev: function () { self.setState({ open: (idx - 1 + n) % n }); },
      next: function () { self.setState({ open: (idx + 1) % n }); },
      close: function () { self.setState({ open: -1 }); }
    };
  }
}
</script>
</body>
</html>
