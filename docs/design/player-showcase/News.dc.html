var FILTERS = ['全部', '活动', '维护', '更新', '规则'];

class Component extends DCLogic {
  componentDidMount() {
    this.setState({ view: 'list', articleId: 's3', filter: '全部' });
  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var accent = this.props.accent || '#2EE8DF';
    var filter = s.filter || '全部';
    function open(id) {
      return function () {
        self.setState({ view: 'article', articleId: id });
        var el = document.getElementById('dfs-article-scroll');
        if (el) el.scrollTop = 0;
      };
    }
    function decorate(a) {
      var st = CAT_STYLE[a.cat] || CAT_STYLE['活动'];
      return Object.assign({}, a, { catColor: st.color, catBg: st.bg, open: open(a.id) });
    }
    var list = ARTICLES.filter(function (a) { return filter === '全部' || a.cat === filter; }).map(decorate);
    var featured = list[0] || decorate(ARTICLES[0]);
    var rest = list.slice(1).map(function (a, i) {
      return Object.assign({}, a, { sep: i === 0 ? '1px solid transparent' : '1px solid rgba(255,255,255,.06)' });
    });
    var filters = FILTERS.map(function (f) {
      var on = f === filter;
      var count = f === '全部' ? ARTICLES.length : ARTICLES.filter(function (a) { return a.cat === f; }).length;
      return {
        label: f, count: count, pressed: on ? 'true' : 'false',
        bg: on ? 'color-mix(in oklab, ' + accent + ' 18%, transparent)' : 'rgba(255,255,255,.05)',
        border: on ? 'color-mix(in oklab, ' + accent + ' 55%, transparent)' : 'rgba(255,255,255,.1)',
        color: on ? '#FFFFFF' : 'rgba(243,239,230,.78)',
        pick: function () { self.setState({ filter: f }); }
      };
    });

    var current = decorate(ARTICLES.filter(function (a) { return a.id === s.articleId; })[0] || ARTICLES[0]);
    var h2n = 0;
    var blocks = current.blocks.map(function (b, i) {
      var anchor = '';
      if (b.t === 'h2') { h2n += 1; anchor = 'sec-' + current.id + '-' + h2n; }
      return Object.assign({}, b, {
        isP: b.t === 'p', isH2: b.t === 'h2', isList: b.t === 'list', isCallout: b.t === 'callout', isImg: b.t === 'img',
        anchor: anchor, items: b.items || []
      });
    });
    var toc = blocks.filter(function (b) { return b.isH2; }).map(function (b, i) {
      return { text: b.text, anchor: b.anchor, num: (i < 9 ? '0' : '') + (i + 1) };
    });
    var related = ARTICLES.filter(function (a) { return a.id !== current.id; }).slice(0, 2).map(decorate);

    return {
      accent: accent,
      accentSoft: 'color-mix(in oklab, ' + accent + ' 45%, transparent)',
      accentTint: 'color-mix(in oklab, ' + accent + ' 14%, transparent)',
      isList: (s.view || 'list') === 'list',
      isArticle: s.view === 'article',
      filters: filters,
      featured: featured,
      rest: rest,
      restEmpty: rest.length === 0,
      article: Object.assign({}, current, { blocks: blocks }),
      toc: toc,
      related: related,
      back: function () { self.setState({ view: 'list' }); }
    };
  }
}
